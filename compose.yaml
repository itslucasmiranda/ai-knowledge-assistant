services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    secrets:
      - groq_api_key
    volumes:
      - documents:/app/data
      - model_cache:/app/.cache/huggingface
    restart: unless-stopped

secrets:
  groq_api_key:
    file: ./.groq-key

volumes:
  documents:
  model_cache:
